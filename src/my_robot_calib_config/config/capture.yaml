robot_calibration:
  ros__parameters:
    chains: [arm_chain]
    features: [checkerboard_finder]
    required_joints: [j1, j2, j3, j4, j5, j6]
    min_samples: 12
    verbose: true

    arm_chain:
      # 手动采集仍监听真实 /joint_states；不执行轨迹。
      topic: /manipulator_controller/follow_joint_trajectory 
      joints:
        - j1
        - j2
        - j3
        - j4
        - j5
        - j6

    checkerboard_finder:
      type: robot_calibration::CheckerboardFinder2d
      # camera2d 使用 CameraInfo.P 投影，必须配套使用去畸变图像。
      topic: /calibration/image_rect
      camera_info_topic: /camera/color/camera_info
      read_driver_parameters: false
      camera_sensor_name: camera
      chain_sensor_name: board
      frame_id: checkerboard_link
      # 内角点数和实测格长（米），不是黑白方格数量。
      points_x: 5
      points_y: 4
      size: 0.025
      debug: true
