# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    fairino16_controller:
      type: joint_trajectory_controller/JointTrajectoryController

 #   test_force_torque_sensor_broadcaster:
 #     type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster  # Humble

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

#test_force_torque_sensor_broadcaster:
#  ros__parameters:
#    frame_id:  "wrist3_link"
#    sensor_name:  "tcp_fts_sensor"

fairino16_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
