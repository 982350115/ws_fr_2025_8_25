ball_detector_node:
  ros__parameters:
    # ------------------------------------
    # 1. 坐标系和话题配置
    # ------------------------------------
    target_frame: "world"        # 将球的位置转换到的目标坐标系 (如 world 或 base_link)
    input_topic: "/depth_camera/points"
    output_topic: "/ball_detector/ball_pose"
    
    # ------------------------------------
    # 2. 滤波参数 (PassThrough - ROI)
    # ------------------------------------
    # 限制点云的感兴趣区域 (ROI)，排除机械臂后方和远处物体
    # 这些值需要根据您的 Gazebo 场景和机械臂位置进行调整
    roi_filter:
      # X 轴 (前后) 范围，单位：米
      x_range: [0.2, 0.8]  
      # Y 轴 (左右) 范围，单位：米
      y_range: [-0.3, 0.3]
      # Z 轴 (上下) 范围，单位：米
      z_range: [0.01, 1.0] # 排除地面和太高的天空点 (假设桌子在 0.01m 以上)

    # ------------------------------------
    # 3. 欧几里德聚类参数
    # ------------------------------------
    clustering:
      # 簇提取的距离阈值 (tolerance)，单位：米。小球点必须在彼此距离内。
      cluster_tolerance: 0.02
      # 最小簇大小（点数）
      min_cluster_size: 50
      # 最大簇大小（点数）
      max_cluster_size: 1000

    # ------------------------------------
    # 4. 平面分割 (RANSAC) 参数
    # ------------------------------------
    ransac:
      # 平面拟合的最大迭代次数
      max_iterations: 100
      # 平面拟合的距离阈值 (点离平面的最大距离)，单位：米
      distance_threshold: 0.01